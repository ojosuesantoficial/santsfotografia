    <g transform="translate(65, 335) rotate(3)">
      <rect x="0" y="0" width="55" height="66" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="49" height="60" rx="1" fill="#E8DFD5" />
      <circle cx="25" cy="28" r="12" fill="#C9AD95" />
      <path d="M 12 50 L 38 50 L 25 38 Z" fill="#998371" />
    </g>

    <!-- Photo 14: Sunset couple beach -->
    <g transform="translate(105, 330) rotate(-6)">
      <rect x="0" y="0" width="76" height="58" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="70" height="52" rx="1" fill="#F8EFE4" />
      <circle cx="54" cy="18" r="11" fill="#E9B77F" opacity="0.6" />
      <circle cx="28" cy="24" r="5.5" fill="#4B4137" />
      <circle cx="40" cy="25" r="5" fill="#66594C" />
      <path d="M 3 38 Q 38 30 73 38 L 73 55 L 3 55 Z" fill="#D3C0AD" />
    </g>

    <!-- Photo 15: Cute baby sitting -->
    <g transform="translate(110, 410) rotate(4)">
      <rect x="0" y="0" width="68" height="54" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="62" height="48" rx="1" fill="#FAF6F0" />
      <circle cx="34" cy="20" r="8" fill="#F3DFD1" />
      <rect x="22" y="32" width="24" height="20" rx="6" fill="#E9DCD1" />
    </g>

    <!-- Photo 16: Mother with blond toddler -->
    <g transform="translate(180, 395) rotate(-8)">
      <rect x="0" y="0" width="62" height="60" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="56" height="54" rx="1" fill="#EFE8DF" />
      <circle cx="38" cy="20" r="7.5" fill="#DEC6B2" />
      <circle cx="20" cy="26" r="6" fill="#F7E6D7" />
      <path d="M 5 44 Q 30 32 55 44 L 55 57 L 5 57 Z" fill="#C4AA94" />
    </g>

    <!-- Photo 17: Golden sunset horizon -->
    <g transform="translate(235, 400) rotate(5)">
      <rect x="0" y="0" width="68" height="52" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="62" height="46" rx="1" fill="#F5ECE2" />
      <circle cx="32" cy="16" r="8" fill="#E5BE8E" opacity="0.75" />
      <circle cx="28" cy="26" r="4.5" fill="#52473D" />
      <circle cx="38" cy="27" r="4.5" fill="#695C50" />
      <path d="M 3 34 Q 34 26 65 34 L 65 49 L 3 49 Z" fill="#C1AB97" />
    </g>

    <!-- Photo 18: Sleeping newborn basket -->
    <g transform="translate(305, 385) rotate(-6)">
      <rect x="0" y="0" width="66" height="56" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="60" height="50" rx="1" fill="#FAF6F0" />
      <ellipse cx="33" cy="35" rx="20" ry="12" fill="#E6D3C1" />
      <circle cx="32" cy="26" r="6" fill="#F7E6D9" />
    </g>

    <!-- Photo 19: Romantic kiss couple -->
    <g transform="translate(225, 450) rotate(-2)">
      <rect x="0" y="0" width="70" height="50" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="64" height="44" rx="1" fill="#EAE2D8" />
      <circle cx="28" cy="18" r="6" fill="#3D3630" />
      <circle cx="42" cy="18" r="5.5" fill="#E2C9B4" />
      <path d="M 3 30 Q 35 24 67 30 L 67 47 L 3 47 Z" fill="#A89481" />
    </g>

    <!-- Photo 20: Happy wedding couple -->
    <g transform="translate(330, 335) rotate(14)">
      <rect x="0" y="0" width="62" height="66" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="56" height="60" rx="1" fill="#F2ECE4" />
      <circle cx="22" cy="20" r="6" fill="#38312B" />
      <circle cx="38" cy="22" r="5.5" fill="#DECAB8" />
      <path d="M 28 34 L 52 63 L 18 63 Z" fill="#FDFCFA" />
      <rect x="10" y="32" width="16" height="31" rx="2" fill="#2E2824" />
    </g>
  </g>
</svg>
