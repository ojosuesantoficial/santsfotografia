<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft shadow filter for 3D wood depth -->
    <filter id="woodShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    
    <!-- Warm beige wood gradient -->
    <linearGradient id="woodBeigeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4C3" />
      <stop offset="35%" stop-color="#D7C4AF" />
      <stop offset="70%" stop-color="#CBB59D" />
      <stop offset="100%" stop-color="#BFAB93" />
    </linearGradient>

    <!-- Wood edge highlight -->
    <linearGradient id="woodEdgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE6DB" />
      <stop offset="100%" stop-color="#B8A28A" />
    </linearGradient>
  </defs>

  <!-- Base Wooden 'S' Silhouette -->
  <g filter="url(#woodShadow)">
    <path d="M 390 135 C 390 65, 330 25, 250 25 C 160 25, 95 75, 95 155 C 95 240, 185 270, 260 295 C 330 320, 385 345, 385 410 C 385 470, 320 505, 235 505 C 140 505, 75 455, 65 375 L 145 365 C 150 415, 185 445, 240 445 C 290 445, 315 420, 315 390 C 315 330, 240 300, 160 270 C 95 240, 30 195, 30 135 C 30 55, 110 0, 250 0 C 365 0, 455 50, 455 140 Z" fill="url(#woodBeigeGrad)" stroke="url(#woodEdgeGrad)" stroke-width="4" transform="matrix(0.88, 0, 0, 0.88, 38, 28)" />
  </g>

  <!-- Photo Collage Mosaic Overlays with white borders across the 'S' curve -->
  <!-- Top Arc Photos -->
  <g filter="url(#photoShadow)">
    <!-- Photo 1: Beach family -->
    <g transform="translate(145, 45) rotate(-6)">
      <rect x="0" y="0" width="70" height="52" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="64" height="46" rx="1" fill="#E8DCD1" />
      <path d="M 3 32 Q 25 24 45 35 T 67 30 L 67 49 L 3 49 Z" fill="#D3C0AF" />
      <circle cx="24" cy="18" r="5" fill="#B39B84" />
      <circle cx="38" cy="16" r="6" fill="#A88F76" />
      <circle cx="50" cy="20" r="4.5" fill="#C5B19E" />
    </g>

    <!-- Photo 2: Couple golden hour -->
    <g transform="translate(225, 30) rotate(4)">
      <rect x="0" y="0" width="68" height="54" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="62" height="48" rx="1" fill="#F1E7DD" />
      <circle cx="26" cy="20" r="7" fill="#BD9F83" />
      <circle cx="42" cy="22" r="6.5" fill="#CDAE92" />
      <path d="M 3 36 Q 30 28 65 38 L 65 51 L 3 51 Z" fill="#A58B72" opacity="0.6" />
    </g>

    <!-- Photo 3: Wedding bride & groom -->
    <g transform="translate(295, 40) rotate(12)">
      <rect x="0" y="0" width="65" height="60" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="59" height="54" rx="1" fill="#EBE5DC" />
      <path d="M 38 22 L 54 57 L 22 57 Z" fill="#F7F5F0" />
      <rect x="12" y="24" width="18" height="33" rx="2" fill="#3D3833" />
      <circle cx="21" cy="16" r="5.5" fill="#C4AB94" />
      <circle cx="40" cy="15" r="5.5" fill="#DFC9B5" />
    </g>

    <!-- Photo 4: Flowers portrait -->
    <g transform="translate(365, 80) rotate(-4)">
      <rect x="0" y="0" width="50" height="66" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="44" height="60" rx="1" fill="#EFE8E1" />
      <circle cx="25" cy="30" r="14" fill="#D8BEA7" />
      <circle cx="25" cy="30" r="8" fill="#C1A48B" />
      <rect x="22" y="44" width="6" height="19" fill="#998370" />
    </g>

    <!-- Top Left Arch Photos -->
    <!-- Photo 5: Portrait wedding -->
    <g transform="translate(85, 100) rotate(14)">
      <rect x="0" y="0" width="64" height="52" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="58" height="46" rx="1" fill="#EAE0D5" />
      <circle cx="22" cy="18" r="6" fill="#4B443D" />
      <circle cx="38" cy="20" r="5.5" fill="#DFD2C4" />
      <path d="M 3 34 Q 30 26 61 36 L 61 49 L 3 49 Z" fill="#AFA091" />
    </g>

    <!-- Photo 6: Birthday girl smile -->
    <g transform="translate(95, 160) rotate(-8)">
      <rect x="0" y="0" width="68" height="54" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="62" height="48" rx="1" fill="#F4EDE4" />
      <circle cx="34" cy="22" r="10" fill="#CBB29C" />
      <path d="M 12 45 Q 34 32 56 45 L 56 51 L 12 51 Z" fill="#DFC6B1" />
    </g>

    <!-- Photo 7: Couple in meadow -->
    <g transform="translate(160, 170) rotate(6)">
      <rect x="0" y="0" width="70" height="55" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="64" height="49" rx="1" fill="#E5DDD2" />
      <circle cx="26" cy="22" r="7" fill="#695D51" />
      <circle cx="44" cy="22" r="6.5" fill="#E8D2BF" />
      <path d="M 3 36 Q 32 28 67 36 L 67 52 L 3 52 Z" fill="#889C82" opacity="0.65" />
    </g>

    <!-- Photo 8: Mother with baby -->
    <g transform="translate(325, 115) rotate(7)">
      <rect x="0" y="0" width="55" height="66" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="49" height="60" rx="1" fill="#F8F3EC" />
      <circle cx="24" cy="22" r="8" fill="#D3BAA4" />
      <circle cx="36" cy="34" r="5" fill="#EBD6C5" />
      <path d="M 8 50 Q 25 36 44 50 L 44 63 L 8 63 Z" fill="#D8C2AF" />
    </g>

    <!-- Center Diagonal & Spine Photos -->
    <!-- Photo 9: Family 4 persons -->
    <g transform="translate(150, 225) rotate(-3)">
      <rect x="0" y="0" width="72" height="54" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="66" height="48" rx="1" fill="#EDE4D9" />
      <circle cx="16" cy="20" r="4.5" fill="#4A443E" />
      <circle cx="28" cy="18" r="5" fill="#5B534C" />
      <circle cx="42" cy="19" r="4.5" fill="#DDBEA6" />
      <circle cx="54" cy="22" r="4" fill="#C5A890" />
      <path d="M 3 34 Q 36 26 69 36 L 69 51 L 3 51 Z" fill="#BFAB97" />
    </g>

