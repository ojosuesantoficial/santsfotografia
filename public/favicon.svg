    <g transform="translate(225, 230) rotate(9)">
      <rect x="0" y="0" width="56" height="70" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="50" height="64" rx="1" fill="#F5EFE8" />
      <circle cx="26" cy="22" r="8.5" fill="#D1B8A3" />
      <path d="M 12 40 Q 32 30 42 58 L 10 58 Z" fill="#E3CFBE" />
      <path d="M 3 50 Q 25 44 53 50 L 53 67 L 3 67 Z" fill="#B39E8A" />
    </g>

    <!-- Photo 11: Graduation portrait -->
    <g transform="translate(305, 235) rotate(-10)">
      <rect x="0" y="0" width="54" height="66" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="48" height="60" rx="1" fill="#EAE2D8" />
      <polygon points="24,10 38,15 24,20 10,15" fill="#262320" />
      <circle cx="24" cy="26" r="6.5" fill="#DDBFA8" />
      <rect x="12" y="38" width="24" height="25" rx="2" fill="#2B2724" />
    </g>

    <!-- Photo 12: Father holding baby -->
    <g transform="translate(325, 290) rotate(5)">
      <rect x="0" y="0" width="66" height="56" rx="2" fill="#FFFFFF" />
      <rect x="3" y="3" width="60" height="50" rx="1" fill="#F1ECE4" />
      <circle cx="26" cy="22" r="9" fill="#5E5349" />
      <circle cx="44" cy="26" r="6" fill="#F0DCCC" />
      <path d="M 8 44 Q 30 34 56 46 L 56 53 L 8 53 Z" fill="#CCAFA0" />
